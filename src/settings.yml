---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.1.1
serverless_language: python
polling_url: https://wakatime.com/api/v1/users/current/stats/{{ range }}?is_including_today=true
polling_headers: Authorization=Bearer {{ oauth_access_token }}
polling_body: ''
id: 241536
oauth_enabled: 'true'
oauth_pkce_enabled: 'no'
oauth_authorize_url: https://wakatime.com/oauth/authorize
oauth_token_url: https://wakatime.com/oauth/token
oauth_scopes: read_stats
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: info
  field_type: author_bio
  name: About This Plugin
  description: "This plugin displays WakaTime statistics using <a href=\"https://wakatime.com/developers#stats\" target=\"_blank\">WakaTime's API</a>.\nIt requires you to authorize the plugin with your WakaTime Account. Your profile doesn't have to be set to public.\n<br>\nThis plugin can show you the same information as you display on your profile,\nexcept for the activity diagram. For that see <a href=\"https://trmnl.com/recipes/123718\" target=\"_blank\">WakaTime Dashboard</a>: a plugin that \ndisplays WakaTime coding activity.\n"
  category: productivity
  github_url: https://github.com/theCapypara/trmnl-wakatime-stats
- keyname: show_times
  field_type: boolean
  name: Show times
  description: Show total & daily average coding time (full & half vertical layout only)
  default: 'true'
  optional: true
- keyname: show_ai_percentage
  field_type: boolean
  name: Show AI stats
  description: Show a percentage of AI vs. human coding time (full & half vertical layout only)
  default: 'false'
  optional: true
- keyname: range
  field_type: select
  name: Range
  options:
  - Last 7 Days: last_7_days
  - Last 30 Days: last_30_days
  - Last 6 Months: last_6_months
  - Last Year: last_year
  - All Time: all_time
  default: last_7_days
- keyname: stats
  field_type: select
  name: Statistics
  description: Configure what information to display.
  help_text: Use <kbd>⌘</kbd>+<kbd>click</kbd> or <kbd>ctrl</kbd>+<kbd>click</kbd> to select and deselect multiple options.
  options:
  - Categories: categories
  - Editors: editors
  - Languages: languages
  - Operating Systems: operating_systems
  - Machines: machines
  - Projects: projects
  - Dependencies: dependencies
  multiple: true
- keyname: display
  field_type: select
  name: Display Style
  description: How to display the selected statistics.
  help_text: "'Pie Chart with labels' can only be used if only one 'Statistic' is chosen."
  options:
  - Item list: items
  - Bar chart race: bar_race
  - Pie Chart: pie_chart
  - Pie Chart with labels: pie_chart_with_labels
- keyname: include_other
  field_type: boolean
  name: Include stats for the "Other" language
  default: 'true'
  optional: true
name: WakaTime Stats
refresh_interval: 1440
